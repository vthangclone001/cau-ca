<!DOCTYPE html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Câu cá gọi tên</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:#04204a;overflow:hidden;font-family:'Baloo 2','Segoe UI',system-ui,sans-serif;color:#fff}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#stage canvas{display:block}
button{font:inherit;cursor:pointer;border:0}
.btn{display:inline-block;background:linear-gradient(#ffb347,#ff7b1c);color:#fff;font-weight:800;border-radius:999px;padding:8px 20px;box-shadow:0 4px 0 #b34a00,0 8px 18px #0006;text-shadow:0 1px 2px #0005}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b34a00}
.btn:disabled{filter:grayscale(.8);opacity:.6;cursor:default}
.sm{padding:4px 14px;font-size:15px}
#cast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);font-size:clamp(20px,3.4vw,32px);padding:8px 36px;z-index:3}
#cast:active{transform:translate(-50%,3px)}
#top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none;z-index:3}
#top>*{pointer-events:auto}
h1{margin:0;font-size:clamp(15px,2.3vw,26px);text-shadow:0 2px 6px #0008}
#status{background:#0005;border-radius:999px;padding:2px 16px;font-size:clamp(13px,1.6vw,18px);font-weight:700;pointer-events:none}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(360px,92vw);box-sizing:border-box;background:rgba(8,30,66,.95);padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 16px;transform:translateX(105%);transition:transform .3s;overflow:auto;z-index:6;box-shadow:-8px 0 30px #0008}
#panel.open{transform:none}
#panel h2{margin:4px 0 8px;font-size:19px}
textarea,input[type=number]{width:100%;box-sizing:border-box;border-radius:10px;border:1px solid #4a7bb5;background:#0b2c5a;color:#fff;font:inherit;padding:8px}
textarea{height:170px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;margin:9px 0}
#hist{font-size:14px;max-height:150px;overflow:auto;padding-left:22px;margin:6px 0}
#info{font-size:14px;color:#9fd3ff}
#card{position:fixed;left:50%;top:52%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;text-align:center;background:linear-gradient(#fff,#dff3ff);color:#0b3b6e;border-radius:28px;padding:20px 38px 24px;min-width:min(86vw,420px);max-width:92vw;box-sizing:border-box;box-shadow:0 0 0 6px #ffd24d,0 20px 60px #000a;transition:.35s cubic-bezier(.2,1.6,.4,1);z-index:4}
#card.on{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
#csub{font-size:18px;color:#1c7fb8;font-weight:700}
#cname{font-size:clamp(40px,9vw,104px);font-weight:800;line-height:1.1;color:#e8590c;word-break:break-word;margin:2px 0}
#ccall{font-size:clamp(18px,2.6vw,28px);font-weight:700;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);transform:translateX(-50%);background:#000b;padding:6px 18px;border-radius:12px;opacity:0;transition:.3s;z-index:7;pointer-events:none;text-align:center}
.x{width:38px;height:38px;padding:0;border-radius:50%;font-size:18px;line-height:1;background:linear-gradient(#ff8a8a,#e63946);box-shadow:0 4px 0 #9b1c27,0 8px 16px #0006;display:inline-flex;align-items:center;justify-content:center;flex:none}
.x:active{box-shadow:0 1px 0 #9b1c27}
#cx{position:absolute;top:-14px;right:-14px;width:36px;height:36px;font-size:17px}
#csub,#status{display:none!important}
#brand{display:flex;align-items:center;gap:10px}
</style></head><body>
<div id="stage"></div>
<div id="top"><div id="brand"><button class="btn x" id="xbtn" title="Về menu (Esc)" aria-label="Về menu">✕</button><h1>🎣 Câu cá gọi tên</h1></div><div id="status"></div><button class="btn sm" id="popen">📋 Danh sách</button></div>
<button class="btn" id="cast">🎣 THẢ CÂU</button>
<div id="card"><button class="btn x" id="cx" title="Đóng, về menu" aria-label="Đóng">✕</button><div id="csub"></div><div id="cname"></div><div id="ccall">Mời bạn lên bảng! 🎉</div><button class="btn" id="next">🎣 Thả câu tiếp</button></div>
<div id="toast"></div>
<aside id="panel">
<h2>📋 Danh sách lớp <button class="btn sm" id="pclose" style="float:right">✕</button></h2>
<textarea id="ta" placeholder="Mỗi dòng một tên hoặc số thứ tự"></textarea>
<div class="row"><button class="btn sm" id="apply">Áp dụng</button><label class="btn sm" style="cursor:pointer">📂 Excel / CSV<input id="file" type="file" accept=".xlsx,.xls,.csv" hidden></label></div>
<div class="row">STT từ 1 đến <input id="num" type="number" min="1" max="300" value="30" style="width:84px"><button class="btn sm" id="gen">Tạo</button></div>
<label class="row"><input type="checkbox" id="norep" checked> Không gọi lặp lại</label>
<div id="info"></div><ol id="hist"></ol>
<button class="btn sm" id="reset">🔄 Làm mới lượt gọi</button>
</aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const W=1280,H=720,WL=220,PI=Math.PI,BX=400,$=id=>document.getElementById(id);
const R=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),lp=(a,b,t)=>a+(b-a)*t,ez=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const wY=(x,t)=>WL+Math.sin(x*.012+t*1.6)*4+Math.sin(x*.031-t*1.1)*2.5;
const gY=x=>640+Math.sin(x*.009)*10+Math.sin(x*.027+1)*5;
const mkc=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;return c};
const cv=mkc(),g=cv.getContext('2d'),gc=mkc();
let T=0,DT=.016;
/* ===== static ground ===== */
(()=>{const c=gc.getContext('2d');let q=c.createLinearGradient(0,600,0,H);q.addColorStop(0,'#e3c887');q.addColorStop(1,'#8f7040');
c.fillStyle=q;c.beginPath();c.moveTo(0,H);for(let x=0;x<=W;x+=8)c.lineTo(x,gY(x));c.lineTo(W,H);c.fill();
for(let i=0;i<700;i++){const x=R(0,W);c.fillStyle=Math.random()<.5?'rgba(255,245,210,.3)':'rgba(80,55,20,.25)';c.fillRect(x,R(gY(x)+3,H),R(1,3),R(1,2))}
[[70,44,26],[190,30,18],[470,50,28],[690,36,20],[860,56,32],[1040,34,20],[1210,48,28],[330,24,14]].forEach(([x,w,h])=>{const y=gY(x)+6,r=c.createRadialGradient(x-w*.3,y-h*.6,2,x,y,w);r.addColorStop(0,'#aab6c2');r.addColorStop(1,'#4b5866');c.fillStyle=r;c.beginPath();c.ellipse(x,y,w,h,0,PI,2*PI);c.ellipse(x,y,w,h*.3,0,0,PI);c.fill()});
const star=(x,y,r,col)=>{c.fillStyle=col;c.beginPath();for(let i=0;i<10;i++){const a=-PI/2+i*PI/5,rr=i%2?r*.45:r;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}c.fill();c.fillStyle='rgba(255,255,255,.55)';for(let i=0;i<5;i++){const a=-PI/2+i*2*PI/5;c.beginPath();c.arc(x+Math.cos(a)*r*.5,y+Math.sin(a)*r*.5,r*.08,0,7);c.fill()}};
star(150,gY(150)+24,14,'#ff8c42');star(600,gY(600)+26,12,'#ff5d8f');star(1100,gY(1100)+22,15,'#ffb703');
c.fillStyle='#f4a261';c.beginPath();c.ellipse(560,gY(560)+8,40,28,0,PI,2*PI);c.fill();c.strokeStyle='#c1592a';c.lineWidth=2;for(let i=0;i<5;i++){c.beginPath();c.arc(560-20+i*10,gY(560)-6,9,PI,2*PI);c.stroke()}
for(let i=0;i<14;i++){const x=R(20,W-20);c.fillStyle='#fff3e0';c.beginPath();c.ellipse(x,gY(x)+R(14,40),6,4,R(0,3),0,7);c.fill()}
})();
const weeds=Array.from({length:34},()=>({x:R(10,W-10),h:R(70,170),w:R(5,9),ph:R(0,6),c:['#2e9e5b','#3fbf6a','#1f7a4d','#6fcf5a'][Math.floor(R(0,4))]}));
const corals=[[120,'#ff5d8f'],[380,'#ff7aa2'],[520,'#ff9f1c'],[760,'#b388eb'],[980,'#ff5d8f'],[1150,'#ffa94d']];
function branch(x,y,a,l,d){if(d<=0)return;const sw=Math.sin(T*1.2+x*.05)*.04*(6-d),x2=x+Math.cos(a+sw)*l,y2=y+Math.sin(a+sw)*l;g.lineWidth=d*2.2;g.beginPath();g.moveTo(x,y);g.lineTo(x2,y2);g.stroke();if(d==1){g.beginPath();g.arc(x2,y2,3.5,0,7);g.fill()}branch(x2,y2,a-.45,l*.76,d-1);branch(x2,y2,a+.45,l*.76,d-1)}
function flora(){g.lineCap='round';weeds.forEach(w=>{g.strokeStyle=w.c;let px=w.x,py=gY(w.x)+4;const n=10,sl=w.h/n;for(let i=1;i<=n;i++){const x=w.x+Math.sin(T*1.3+w.ph+i*.45)*i*2.4,y=py-sl;g.lineWidth=w.w*(1-i/(n+2));g.beginPath();g.moveTo(px,py);g.lineTo(x,y);g.stroke();px=x;py=y}});
corals.forEach(([x,c])=>{g.strokeStyle=c;g.fillStyle=c;branch(x,gY(x)+8,-PI/2,32,5)});g.lineCap='butt'}
/* ===== creatures ===== */
const PAL=[['#ffc233','#f77f00'],['#5ec8f2','#3a5bd9'],['#ff6b81','#c2185b'],['#8be36b','#2e9e5b'],['#ffd166','#ef6c00'],['#c9a7ff','#7b2cbf'],['#7bdff2','#0077b6']];
function dFish(s,c1,c2,ph){const w=Math.sin(T*9+ph)*.4;g.fillStyle=c2;g.save();g.translate(-s*.85,0);g.rotate(w);g.beginPath();g.moveTo(s*.1,0);g.lineTo(-s*.65,-s*.55);g.quadraticCurveTo(-s*.4,0,-s*.65,s*.55);g.closePath();g.fill();g.restore();
g.beginPath();g.moveTo(-s*.35,-s*.4);g.quadraticCurveTo(0,-s*1.05,s*.45,-s*.42);g.fill();
g.fillStyle=c1;g.beginPath();g.ellipse(0,0,s,s*.56,0,0,7);g.fill();g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.ellipse(s*.05,s*.22,s*.85,s*.25,0,0,7);g.fill();g.beginPath();g.fillStyle='rgba(255,255,255,.5)';g.ellipse(s*.2,0,s*.1,s*.5,0,0,7);g.fill();
g.fillStyle=c2;g.save();g.translate(s*.05,s*.1);g.rotate(.5+w*.6);g.beginPath();g.ellipse(-s*.15,s*.12,s*.28,s*.1,0,0,7);g.fill();g.restore();
g.fillStyle='#fff';g.beginPath();g.arc(s*.55,-s*.14,s*.17,0,7);g.fill();g.fillStyle='#111';g.beginPath();g.arc(s*.6,-s*.14,s*.08,0,7);g.fill();g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=1;g.beginPath();g.moveTo(s*.97,s*.05);g.lineTo(s*.8,s*.1);g.stroke()}
function dPuffer(s,c1,c2,ph){const w=Math.sin(T*9+ph)*.4;g.fillStyle=c2;g.save();g.translate(-s*.95,0);g.rotate(w);g.beginPath();g.ellipse(-s*.2,0,s*.3,s*.35,0,0,7);g.fill();g.restore();
g.strokeStyle=c2;g.lineWidth=2;for(let i=0;i<12;i++){const a=-PI*.95+i*PI*.17;g.beginPath();g.moveTo(Math.cos(a)*s,Math.sin(a)*s);g.lineTo(Math.cos(a)*s*1.22,Math.sin(a)*s*1.22);g.stroke()}
g.fillStyle=c1;g.beginPath();g.arc(0,0,s,0,7);g.fill();g.fillStyle='#fff5cc';g.beginPath();g.ellipse(0,s*.35,s*.78,s*.55,0,0,PI);g.fill();
g.fillStyle=c2;for(let i=0;i<5;i++){g.beginPath();g.arc(-s*.5+i*s*.22,-s*.45+Math.sin(i*2)*s*.12,s*.07,0,7);g.fill()}
g.fillStyle='#fff';g.beginPath();g.arc(s*.5,-s*.2,s*.2,0,7);g.fill();g.fillStyle='#111';g.beginPath();g.arc(s*.56,-s*.2,s*.1,0,7);g.fill();g.fillStyle='#c0392b';g.beginPath();g.ellipse(s*.95,s*.1,s*.1,s*.07,0,0,7);g.fill()}
function dShark(s,ph){const w=Math.sin(T*3+ph)*.25;g.fillStyle='#6d8296';g.beginPath();g.moveTo(s*1.3,0);g.bezierCurveTo(s*.8,-s*.45,-s*.3,-s*.4,-s*1.1,-s*.08);g.lineTo(-s*1.1,s*.08);g.bezierCurveTo(-s*.3,s*.42,s*.8,s*.3,s*1.3,0);g.fill();
g.fillStyle='#e6eef3';g.beginPath();g.moveTo(s*1.28,s*.03);g.bezierCurveTo(s*.8,s*.28,-s*.3,s*.4,-s*1.05,s*.07);g.bezierCurveTo(-s*.3,s*.12,s*.8,s*.1,s*1.28,s*.03);g.fill();
g.fillStyle='#5b7084';g.save();g.translate(-s*1.05,0);g.rotate(w);g.beginPath();g.moveTo(s*.1,0);g.lineTo(-s*.45,-s*.55);g.lineTo(-s*.3,0);g.lineTo(-s*.4,s*.4);g.closePath();g.fill();g.restore();
g.beginPath();g.moveTo(s*.1,-s*.32);g.lineTo(-s*.15,-s*.85);g.lineTo(-s*.3,-s*.3);g.fill();g.beginPath();g.moveTo(s*.3,s*.2);g.lineTo(0,s*.62);g.lineTo(-s*.1,s*.25);g.fill();
g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=1.5;for(let i=0;i<3;i++){g.beginPath();g.moveTo(s*(.58-i*.06),-s*.12);g.lineTo(s*(.54-i*.06),s*.14);g.stroke()}
g.fillStyle='#111';g.beginPath();g.arc(s*.88,-s*.1,s*.05,0,7);g.fill();g.strokeStyle='#33414f';g.beginPath();g.arc(s*1.1,s*.02,s*.12,.3,1.7);g.stroke()}
function dJelly(s,ph){const k=1+Math.sin(T*2.4+ph)*.12;g.strokeStyle='rgba(255,190,235,.65)';g.lineWidth=2.5;for(let i=-2;i<=2;i++){g.beginPath();g.moveTo(i*s*.35,s*.1);for(let j=1;j<=6;j++)g.lineTo(i*s*.35+Math.sin(T*3+ph+j*.8+i)*s*.12,s*.1+j*s*.28);g.stroke()}
g.fillStyle='rgba(255,160,225,.72)';g.beginPath();g.ellipse(0,0,s,s*.8*k,0,PI,2*PI);g.quadraticCurveTo(s*.5,s*.25,0,s*.15);g.quadraticCurveTo(-s*.5,s*.25,-s,0);g.fill();g.fillStyle='rgba(255,255,255,.5)';g.beginPath();g.ellipse(-s*.3,-s*.4*k,s*.25,s*.12,-.5,0,7);g.fill()}
function dCrab(s,ph){g.strokeStyle='#c1121f';g.lineWidth=3;for(let k=-1;k<=1;k+=2)for(let i=0;i<3;i++){const sw=Math.sin(T*10+ph+i)*3;g.beginPath();g.moveTo(k*s*.5,s*(.05+i*.12));g.lineTo(k*s*.95+sw,s*(.15+i*.1));g.lineTo(k*s*1.1+sw,s*.5);g.stroke()}
g.fillStyle='#e63946';for(let k=-1;k<=1;k+=2){g.beginPath();g.arc(k*s*.95,-s*.55+Math.sin(T*3+ph)*3,s*.3,0,7);g.fill();g.beginPath();g.moveTo(k*s*.5,-s*.1);g.lineTo(k*s*.8,-s*.4);g.stroke()}
g.beginPath();g.ellipse(0,0,s*.7,s*.45,0,0,7);g.fill();g.fillStyle='#fff';for(let k=-1;k<=1;k+=2){g.beginPath();g.arc(k*s*.25,-s*.5,s*.1,0,7);g.fill()}g.fillStyle='#111';for(let k=-1;k<=1;k+=2){g.beginPath();g.arc(k*s*.25,-s*.5,s*.05,0,7);g.fill()}}
const drawType=(t,s,c,ph)=>t==='shark'?dShark(s,ph):t==='puffer'?dPuffer(s,c[0],c[1],ph):dFish(s,c[0],c[1],ph);
function ent(x,y,dir,tilt,fn,a){g.save();if(a!==undefined)g.globalAlpha=a;g.translate(x,y);g.scale(dir,1);g.rotate(tilt);fn();g.restore()}
const amb=[];
function school(n,cy,sp,s,ci,d){const cx=R(0,W);for(let i=0;i<n;i++)amb.push({t:'fish',x:cx+R(-100,100),by:cy+R(-38,38),vx:d*sp*R(.93,1.07),s:s*R(.85,1.15),c:PAL[ci],ph:R(0,6),fs:R(1,2.2),fa:R(3,8)})}
school(10,300,40,11,0,1);school(9,360,55,13,1,-1);school(12,430,35,9,2,1);school(7,330,70,16,3,-1);school(8,490,45,15,4,1);school(6,545,30,14,5,-1);
amb.push({t:'shark',x:200,by:520,vx:48,s:70,ph:0,fs:.4,fa:14},{t:'shark',x:900,by:455,vx:-34,s:52,ph:2,fs:.5,fa:10});
[[390,22],[470,-18],[565,26]].forEach(([y,v],i)=>amb.push({t:'puffer',x:R(0,W),by:y,vx:v,s:21,c:['#ffd166','#ef8f00'],ph:i,fs:.8,fa:10}));
[[320,150],[410,520],[470,860],[360,1100]].forEach(([y,x],i)=>amb.push({t:'jelly',x,by:y,vx:R(-9,9),s:20,ph:i*1.7,fs:.7,fa:28}));
[250,730,1020].forEach(x=>amb.push({t:'crab',x,x0:x,vx:R(14,22)*(Math.random()<.5?-1:1),s:15,ph:R(0,6)}));
function ambient(){amb.forEach(e=>{e.x+=e.vx*DT;if(e.t==='crab'){if(Math.abs(e.x-e.x0)>90)e.vx*=-1;ent(e.x,gY(e.x)+2,1,0,()=>dCrab(e.s,e.ph));return}
if(e.vx>0&&e.x>W+150)e.x=-150;if(e.vx<0&&e.x<-150)e.x=W+150;const y=e.by+Math.sin(T*e.fs+e.ph)*e.fa;
if(e.t==='jelly')ent(e.x,y,1,Math.sin(T+e.ph)*.1,()=>dJelly(e.s,e.ph));else ent(e.x,y,Math.sign(e.vx),Math.cos(T*e.fs+e.ph)*.06,()=>drawType(e.t,e.s,e.c,e.ph))})}
/* ===== effects ===== */
let P=[],B=[],rip=[],drops=[];const plank=Array.from({length:70},()=>({x:R(0,W),y:R(WL+20,H-60),v:R(3,9),ph:R(0,6)}));
const bub=(x,y)=>{if(B.length<90)B.push({x,y,r:R(2,5),v:R(30,60),ph:R(0,6)})};
function burst(x,y,n,cols,sp,up,cf){for(let i=0;i<n;i++){const a=R(0,2*PI),v=R(.3,1)*sp;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-up,l:0,m:cf?R(2,3.5):R(.7,1.4),c:cols[i%cols.length],r:R(2,5),cf,rot:R(0,7)})}}
const splash=x=>{burst(x,WL,18,['#fff','#cdeeff','#8fd8f5'],150,190,0);rip.push({x,l:0});for(let i=0;i<8;i++)bub(x+R(-10,10),WL+R(5,40))};
/* ===== scenery ===== */
const skyG=g.createLinearGradient(0,0,0,WL);skyG.addColorStop(0,'#4fb6f0');skyG.addColorStop(.6,'#9ddcff');skyG.addColorStop(1,'#ffeccb');
const watG=g.createLinearGradient(0,WL-5,0,H);[[0,'#47cdee'],[.25,'#1f93c9'],[.65,'#0c4f8f'],[1,'#062a5c']].forEach(([o,c])=>watG.addColorStop(o,c));
const rayG=g.createLinearGradient(0,WL,0,H*.85);rayG.addColorStop(0,'rgba(255,255,255,.22)');rayG.addColorStop(1,'rgba(255,255,255,0)');
